name: Bug report
description: Something doesn't work the way the docs or the code say it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search the existing issues first. A security problem goes through the repository's
        Security tab ("Report a vulnerability"), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps, commands or input that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release, tag or commit you ran.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, and the versions of anything it runs on.
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste error messages or log lines; they're shown as code.
      render: shell
